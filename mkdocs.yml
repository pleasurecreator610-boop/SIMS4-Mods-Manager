site_name: "SIMS 4 Mods Manager"
site_description: "Le Compagnon Tout-en-Un pour gérer, installer et protéger tous vos Mods et Custom Content Les Sims 4"
site_url: "https://pleasurecreator610-boop.github.io/SIMS4-Mods-Manager/"
repo_url: "https://github.com/pleasurecreator610-boop/SIMS4-Mods-Manager"
repo_name: "pleasurecreator610-boop/SIMS4-Mods-Manager"
docs_dir: documentation
site_dir: site

theme:
  name: material
  language: fr
  logo: assets/plumbob.svg
  favicon: assets/plumbob.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/sims4_theme.css

extra_javascript:
  - javascripts/sims4_showcase.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true

nav:
  - "💎 Accueil Sims 4": index.md
  - "✨ Fonctionnalités":
      - Guide Complet des Fonctionnalités: features.md
      - Langues & Internationalisation: i18n.md
  - "🔌 Plateformes & Sites":
      - Catalogue des Plateformes Supportées: providers/README.md
      - Sites Officiels de Prérequis:
          - Deaderpool (MCCC): providers/deaderpool.md
          - Scumbumbo (XML Injector): providers/scumbumbo.md
          - Lumpinou (RPO & Mood Pack): providers/lumpinou.md
          - Wicked.cc (WickedWhims): providers/wickedcc.md
          - Basemental (Drugs & Venue List): providers/basemental.md
      - Catalogues & Créateurs:
          - CurseForge: providers/curseforge.md
          - The Sims Resource (TSR): providers/thesimsresource.md
          - ModTheSims (MTS): providers/modthesims.md
          - Nexus Mods: providers/nexusmods.md
          - Patreon: providers/patreon.md
          - SimsFinds: providers/simsfinds.md
          - Maxis Match CC World: providers/mmccworld.md
          - SimFileShare: providers/simfileshare.md
          - Sims 4 Studio: providers/sims4studio.md
          - GameBanana: providers/gamebanana.md
          - The Sims Catalog: providers/thesimscatalog.md
          - itch.io: providers/itchio.md
          - LittleMsSam: providers/littlemssam.md
          - SixamCC: providers/sixamcc.md
      - Portails Adultes (+18):
          - LoversLab: providers/loverslab.md
          - NSFWMods: providers/nsfwmods.md
          - Synthira.ru: providers/synthira.md
          - F95zone: providers/f95zone.md
          - SmutBase: providers/smutbase.md
  - "🛠️ Espace Technique (Dev)":
      - Architecture & Base de Données: architecture.md
      - Résolution & Classification des Dépendances: dependency_classification_and_noise.md
      - Services & Architecture Providers: services_and_providers.md
      - Modules, Classes & Séquences: modules_and_classes.md
      - APIs Internes & Contrats: architecture/INTERNAL_APIS.md
      - Architecture Decision Records (ADR):
          - Index: adr/index.md
          - ADR 0001 - Clean Architecture: adr/0001-clean-architecture-boundaries.md
          - ADR 0002 - SQLite WAL & Upsert: adr/0002-sqlite-wal-and-bulk-upserts.md
          - ADR 0003 - AES-256-GCM Chiffrement: adr/0003-multiplatform-aes-gcm-credentials.md
          - ADR 0004 - Défense Décompression & SSRF: adr/0004-decompression-bomb-defense.md
          - ADR 0005 - Forums IPS Mutualisés: adr/0005-unified-ips-forum-scrapers.md
  - "🌐 API REST":
      - Référence des Endpoints: api_reference.md
      - Spécification REST Complète: api/REST_API.md
  - "🐍 Référence Code":
      - Application - Catalog: reference/application_catalog.md
      - Application - Mods: reference/application_mods.md
      - Application - Dépendances: reference/application_dependencies.md
      - Application - Jeu Sims 4: reference/application_game.md
      - Infrastructure: reference/infrastructure.md
      - API REST & Client: reference/api.md
  - "🚀 Roadmap": proposals_and_roadmap.md
